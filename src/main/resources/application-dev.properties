# Dev-profile overlay (Phase 5 §9 -- see backend/docs/phase-5-platform-hardening.md).
# Behavioral only: never a different datasource (single shared Supabase DB in every environment).

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.postgresql=DEBUG
logging.level.org.flywaydb=DEBUG

spring.jpa.show-sql=true

# Broader actuator surface for local debugging (env, beans, metrics, ...). Still requires a
# valid JWT for anything beyond /actuator/health and /actuator/info -- see SecurityConfig.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
