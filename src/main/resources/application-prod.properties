# Prod-profile overlay (Phase 5 §9 -- see backend/docs/phase-5-platform-hardening.md).
# Deliberately minimal. Behavioral only: never a different datasource (single shared Supabase
# DB in every environment) -- do not add spring.datasource.* or spring.jpa.hibernate.ddl-auto
# overrides here.

logging.level.com.zaxxer.hikari=WARN
logging.level.org.postgresql=WARN
logging.level.org.flywaydb=INFO

spring.jpa.show-sql=false

# Explicit safe default (matches application.properties) -- health/info only, no component detail.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Interactive Swagger UI off in prod; /v3/api-docs (the JSON spec) stays available for tooling.
springdoc.swagger-ui.enabled=false
