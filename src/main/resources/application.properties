spring.application.name=backend

# Environment profile (Phase 5 §9 -- see backend/docs/phase-5-platform-hardening.md).
# application-dev.properties / application-prod.properties hold ONLY behavioral overlays
# (log verbosity, error-response detail, dev-tool exposure) -- never a different datasource,
# since LinkRide runs against one shared Supabase Postgres instance in every environment.
# Defaults to "dev" so local runs behave exactly as before this file existed; deployment sets
# SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Every log line carries the request correlation ID (see CorrelationIdFilter) so a single
# failure can be traced end-to-end without cross-referencing timestamps.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:--}] %logger{36} - %msg%n

server.port=8080

# Route unmatched requests through GlobalExceptionHandler (NoHandlerFoundException) instead of
# Spring Boot's default BasicErrorController whitelabel page (Phase 5 §1).
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Actuator (Phase 5 §8): health/info only by default, no component-level detail -- safe to leave
# public in every environment. application-dev.properties broadens this for local debugging;
# application-prod.properties keeps this exact safe default explicit.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# OpenAPI (Phase 5 §7): the machine-readable JSON spec stays available in every environment for
# tooling; the interactive Swagger UI is gated to non-prod (see application-prod.properties) so
# it isn't discoverable by anyone hitting a production URL.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rate limiting (Phase 5 §11): /api/v1/auth/** only, per-IP, in-memory (no Redis -- see
# AuthRateLimitFilter). Defaults: 5 requests per rolling 60s window per client IP.
linkride.ratelimit.auth.capacity=5
linkride.ratelimit.auth.refill-tokens=5
linkride.ratelimit.auth.refill-period-seconds=60
# Session pooler host (Phase 5 live-testing fix): the direct db.<ref>.supabase.co host is
# IPv6-only, which is unreachable from IPv4-only networks. The pooler host resolves on IPv4 and
# is Supabase's documented workaround -- functionally the same single shared Postgres instance.
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.jqutdscflwqbbqxtebkw
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# JPA/Hibernate Config
# Schema is now owned by Flyway migrations (see src/main/resources/db/migration).
# Hibernate only validates that entities match what Flyway created — it no longer alters the schema.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql is profile-scoped (see application-dev.properties / application-prod.properties)

# Flyway: the Supabase DB already has tables created by the old ddl-auto=update flow.
# Baseline treats that existing state as version 1 instead of trying to re-run CREATE TABLE on it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# MongoDB Atlas Configuration (Loaded from .env)
spring.data.mongodb.uri=${MONGO_URI}

# Supabase JWT Secret for verification (Loaded from .env)
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.url=${SUPABASE_URL}
supabase.publishable.key=${SUPABASE_PUBLISHABLE_KEY}

spring.datasource.driver-class-name=org.postgresql.Driver
# Explicitly set Hikari pool settings (optional)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true

# Hikari/Postgres/Flyway log levels are profile-scoped (see application-dev.properties /
# application-prod.properties) -- previously hardcoded to DEBUG everywhere, which shipped
# verbose connection-pool/SQL noise to every environment regardless of need.

# Routing provider selection: google (default, production) | noop (local dev without an API key)
# | synthetic (devtools seeder only -- fabricates READY routes for free, see SyntheticRouteProvider)
linkride.routing.provider=google

# Google Maps Platform - Directions API (Phase 2A: route generation on ride creation)
linkride.google-maps.api-key=${GOOGLE_MAPS_API_KEY}
linkride.google-maps.directions-base-url=https://maps.googleapis.com/maps/api/directions/json
linkride.google-maps.connect-timeout=2s
linkride.google-maps.read-timeout=3s
linkride.google-maps.max-retries=2
linkride.google-maps.retry-backoff=200ms

# Trip Discovery matching (Phase 2B): coarse candidate pre-filters
linkride.matching.departure-window-minutes=90
# Trip Discovery matching (Phase 2B.5): shared-corridor computation
linkride.matching.corridor-walk-tolerance-meters=750
linkride.matching.min-overlap-fraction=0.15
# Trip Discovery matching (Phase 2B.6): hard-constraint validation
linkride.matching.pickup-time-tolerance-minutes=30
# Trip Discovery matching (Phase 2B.7): scoring engine
linkride.matching.stop-time-seconds=90
linkride.matching.max-passenger-detour-ratio=1.4
linkride.matching.weight-driver-detour-time=0.30
linkride.matching.weight-passenger-detour-ratio=0.15
linkride.matching.weight-walk-fraction=0.20
linkride.matching.weight-benefit=0.15
linkride.matching.weight-time-window=0.20
# Trip Discovery matching (Phase 2B.8): ranking engine
linkride.matching.max-ranked-matches=15

# Passenger boarding / check-in (Phase 4.2): driver-issued QR
linkride.boarding.qr-ttl-minutes=5
# Passenger boarding / check-in (Phase 4.4): driver-assisted OTP fallback
linkride.boarding.otp-ttl-minutes=10
linkride.boarding.otp-max-attempts=5

# Notifications (Phase 6): push-provider selects the active FcmPushSender --
# firebase (default, production, needs a real service account credential) | logging (local dev,
# no Firebase project needed). devtools's CapturingFcmPushSender always wins over both when
# linkride.devtools.enabled=true, regardless of this setting.
linkride.notifications.push-provider=firebase
linkride.notifications.fcm.credentials-path=${FCM_CREDENTIALS_PATH:./serviceAccountKey.json}
linkride.notifications.fcm.max-retries=2
linkride.notifications.fcm.retry-backoff=200ms
linkride.notifications.inbox-default-page-size=20
linkride.notifications.inbox-max-page-size=100

# Developer tool: demo data seeder / scripted scenario (see backend/src/main/java/.../devtools).
# Off by default -- the /api/devtools/** controller is not registered at all unless this is true.
# When enabled, also set linkride.routing.provider=synthetic (below) so seeded rides get a
# READY route without hitting the real Google Directions API.
linkride.devtools.enabled=false
linkride.devtools.seed-email-domain=linkride.seed
linkride.devtools.driver-count=50
linkride.devtools.passenger-count=150
linkride.devtools.min-rides-per-driver=1
linkride.devtools.max-rides-per-driver=3
linkride.devtools.departure-spread-hours=72
linkride.devtools.accept-rate=0.65
linkride.devtools.qr-check-in-rate=0.55
linkride.devtools.otp-check-in-rate=0.25
linkride.devtools.ride-completion-rate=0.5
linkride.devtools.cancellation-rate=0.08